name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun ci

      - name: Confirm tag and package version
        run: |
          package_version="$(bun -e '
            const metadata = await Bun.file("package.json").json();
            if (metadata.private) throw new Error("Remova private somente após aprovar o protocolo v1.");
            console.log(metadata.version);
          ')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Check repository and tarball
        run: bun run check

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-${{ github.ref_name }}
          path: |
            dist/cli.js
            package.json
            README.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use supported npm CLI
        run: npm install --global npm@11.5.1

      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: npm-package-${{ github.ref_name }}
          path: .

      - name: Publish with Trusted Publisher
        run: npm publish --access public
