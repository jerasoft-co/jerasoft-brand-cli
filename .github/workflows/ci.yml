name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun ci

      - name: Check repository
        run: bun run check

      - name: Smoke executable
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          test "$(node dist/cli.js --version)" = "${package_version}"
          test "$(bun --bun dist/cli.js --version)" = "${package_version}"
          node dist/cli.js --help

      - name: Smoke package through npx
        shell: bash
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          archive="$(npm pack --ignore-scripts --silent)"
          trap 'rm -f -- "${archive}"' EXIT
          test "$(timeout 120s npx --yes --package "./${archive}" -- jerasoft-brand --version)" = "${package_version}"

  runtime-smoke:
    name: Runtime smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: bun ci

      - name: Build executable
        run: bun run build

      - name: Execute with Node
        run: |
          node -e "import('@napi-rs/keyring').then(({ AsyncEntry }) => new AsyncEntry('br.com.jerasoft.brand-cli.smoke', 'ci'))"
          node dist/cli.js --version

      - name: Execute with Bun
        run: bun --bun dist/cli.js --version
