name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun ci

      - name: Check repository
        run: bun run check

      - name: Smoke executable
        run: |
          package_version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "$(bun dist/cli.js --version)" = "${package_version}"
          bun dist/cli.js --help
